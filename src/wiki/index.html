<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TabSum — Personal Knowledge Wiki</title>
  <link rel="stylesheet" href="wiki.css">
</head>
<body>
  <div class="wiki-app">
    <!-- Left Sidebar -->
    <aside class="wiki-sidebar">
      <div class="sidebar-header">
        <img src="../assets/icons/icon-48.png" alt="TabSum" class="sidebar-logo">
        <div>
          <h2 class="sidebar-title">TabSum</h2>
          <span class="sidebar-subtitle">Personal Knowledge Hub</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-title">Timeline</div>
        <button class="nav-item active" data-time="">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
          All Summaries
          <span class="badge" id="count-all">0</span>
        </button>
        <button class="nav-item" data-time="favorites">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
          Favorites
          <span class="badge" id="count-favorites">0</span>
        </button>
        <button class="nav-item" data-time="today">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
          Captured Today
          <span class="badge" id="count-today">0</span>
        </button>
        <button class="nav-item" data-time="yesterday">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
          Yesterday
        </button>
        <button class="nav-item" data-time="week">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
          Past 7 Days
        </button>

        <div class="nav-section-title">Topics & Tags</div>
        <div id="sidebar-tags" class="sidebar-tag-list">
          <!-- Tags populated via JS -->
        </div>

        <div class="nav-section-title">Top Domains</div>
        <div id="sidebar-domains" class="sidebar-domain-list">
          <!-- Domains populated via JS -->
        </div>
      </nav>

      <div class="sidebar-footer">
        <button id="export-md-btn" class="footer-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          Export Markdown
        </button>
        <button id="settings-btn" class="footer-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
          Settings
        </button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="wiki-main">
      <header class="main-header">
        <div class="search-container">
          <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" id="wiki-search" placeholder="Search knowledge base (title, summary, takeaways, text)...">
          <button id="wiki-search-clear-btn" class="search-clear-btn hidden" title="Clear search" aria-label="Clear search">✕</button>
        </div>
        <div class="header-controls">
          <div class="sort-control">
            <select id="wiki-sort-select" class="wiki-sort-select" aria-label="Sort knowledge base" title="Sort knowledge base">
              <option value="newest">Newest First</option>
              <option value="oldest">Oldest First</option>
              <option value="reading-time-asc">Quick Reads</option>
              <option value="reading-time-desc">Deep Dives</option>
              <option value="title-asc">Title (A-Z)</option>
              <option value="domain">Domain</option>
            </select>
          </div>
          <span id="results-count" class="results-count">0 items</span>
          <div class="export-dropdown" id="export-dropdown">
            <button id="export-dropdown-btn" class="export-dropdown-btn" aria-haspopup="true" aria-expanded="false" aria-label="Export Knowledge Wiki" title="Export Knowledge Wiki">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
              <span>Export</span>
              <svg class="dropdown-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </button>
            <div id="export-dropdown-menu" class="export-dropdown-menu hidden" role="menu" aria-label="Export options">
              <button class="export-option-btn" role="menuitem" data-format="markdown">
                <span class="option-title">Markdown (.md)</span>
                <span class="option-desc">Consolidated markdown note</span>
              </button>
              <button class="export-option-btn" role="menuitem" data-format="obsidian">
                <span class="option-title">Obsidian (.md)</span>
                <span class="option-desc">Formatted note with Obsidian YAML frontmatter</span>
              </button>
              <button class="export-option-btn" role="menuitem" data-format="json">
                <span class="option-title">JSON Backup (.json)</span>
                <span class="option-desc">Full structured database backup</span>
              </button>
            </div>
          </div>
        </div>
      </header>

      <!-- Active Filter Banner (if tag or domain selected) -->
      <div id="filter-banner" class="filter-banner hidden">
        <span id="filter-label">Filter: </span>
        <button id="clear-filter-btn" class="clear-filter-btn">✕ Clear</button>
      </div>

      <!-- Cards Grid -->
      <div id="cards-container" class="cards-grid">
        <!-- Injected via JS -->
      </div>
    </main>

    <!-- Modern Reader View Dialog -->
    <dialog id="reader-dialog" class="reader-dialog" aria-labelledby="modal-title">
      <div class="modal-card">
        <header class="modal-header">
          <div class="modal-title-group">
            <h2 id="modal-title" class="modal-title"></h2>
            <a id="modal-source-link" href="#" target="_blank" class="modal-source-link"></a>
          </div>
          <div class="modal-header-actions">
            <button id="modal-copy-btn" class="modal-copy-btn" title="Copy Markdown" aria-label="Copy Markdown">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
              <span>Copy Markdown</span>
            </button>
            <button id="modal-close-btn" class="modal-close-btn" title="Close reader view" aria-label="Close reader view">✕</button>
          </div>
        </header>
        <div class="modal-body">
          <div id="modal-summary-box" class="modal-summary-box"></div>
          <div id="modal-text-content" class="modal-text-content"></div>
        </div>
      </div>
    </dialog>

    <!-- Toast Notification -->
    <div id="toast" class="toast hidden"></div>
  </div>

  <script type="module" src="wiki.js"></script>
</body>
</html>
