<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TabSum Knowledge Hub</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <div class="panel-container">
    <!-- Header -->
    <header class="panel-header">
      <div class="brand">
        <img src="../assets/icons/icon-48.png" alt="TabSum" class="brand-icon">
        <div>
          <h1 class="brand-title">TabSum</h1>
          <span class="brand-subtitle">Knowledge Wiki</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="open-wiki-btn" class="icon-btn" title="Open Full Wiki Dashboard">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
        </button>
        <button id="open-options-btn" class="icon-btn" title="Settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </button>
      </div>
    </header>

    <!-- Permission Required Alert Banner -->
    <div id="perm-banner" class="perm-banner hidden">
      <div>
        <strong>Enable Tab Extraction</strong>
        <p>Grant permission to read and summarize background tabs.</p>
      </div>
      <button id="enable-perm-btn" class="perm-btn">Enable</button>
    </div>

    <!-- Quick Action Bar -->
    <div class="quick-action-bar">
      <button id="archive-current-btn" class="primary-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
        Archive Current Tab
      </button>
      <button id="sweep-now-btn" class="secondary-btn" title="Check & archive stale tabs now">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
        Sweep
      </button>
    </div>

    <!-- Quick Stats Bar -->
    <div class="stats-banner">
      <div class="stat-item">
        <span class="stat-num" id="stat-total">0</span>
        <span class="stat-label">Archived</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-item">
        <span class="stat-num" id="stat-today">0</span>
        <span class="stat-label">Today</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-item">
        <span class="stat-num" id="stat-time">0m</span>
        <span class="stat-label">Reading Backlog</span>
      </div>
    </div>

    <!-- Search Input -->
    <div class="search-box">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input type="text" id="search-input" placeholder="Search summaries, tags, domains...">
      <button id="search-clear-btn" class="search-clear-btn hidden" title="Clear search" aria-label="Clear search">✕</button>
      <span id="search-kbd-hint" class="search-kbd-hint">/</span>
    </div>

    <!-- Feed Controls: Tags & Sort -->
    <div class="feed-controls-row">
      <div id="tag-filters" class="tag-filters">
        <!-- Injected via JS -->
      </div>
      <div class="panel-sort-wrapper">
        <select id="panel-sort-select" class="panel-sort-select" aria-label="Sort feed" title="Sort feed">
          <option value="newest">Newest</option>
          <option value="oldest">Oldest</option>
          <option value="reading-time-asc">Quick Reads</option>
          <option value="reading-time-desc">Deep Dives</option>
          <option value="title-asc">A-Z</option>
        </select>
        <button id="density-toggle-btn" class="density-toggle-btn" title="Toggle Compact / Comfortable View" aria-label="Toggle view density"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg></button>
      </div>
    </div>

    <!-- Feed Container -->
    <div id="tabs-feed" class="tabs-feed">
      <!-- Tab summary cards injected here -->
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast hidden" role="status" aria-live="polite">
      <span id="toast-message" class="toast-message"></span>
      <button id="toast-undo-btn" class="toast-undo-btn hidden">Undo</button>
      <div id="toast-progress" class="toast-progress"></div>
    </div>
  </div>

  <script type="module" src="panel.js"></script>
</body>
</html>
